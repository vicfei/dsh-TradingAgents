name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: engine syntax
        run: python3 -m py_compile scripts/tradingagents.py scripts/fetch_card.py scripts/ledger.py
      - name: settlement math discipline (pure, no network)
        run: |
          python3 - <<'EOF'
          import importlib.util
          spec = importlib.util.spec_from_file_location("ledger", "scripts/ledger.py")
          L = importlib.util.module_from_spec(spec); spec.loader.exec_module(L)
          stock = {"2026-10-19": 100.0, "2026-10-20": 101.0, "2026-10-21": 102.0, "2026-10-22": 103.0,
                   "2026-10-23": 104.0, "2026-10-26": 105.0, "2026-10-27": 106.0, "2026-10-28": 107.0}
          bench = {"2026-10-19": 500.0, "2026-10-21": 502.0, "2026-10-28": 505.0}
          r = L.settle_return(stock, bench, "2026-10-20", holding=5, today="2026-11-17")
          assert r and r["entry_date"] == "2026-10-21" and r["exit_date"] == "2026-10-28"
          assert abs(r["raw_return"] - (107/102 - 1)) < 5e-5
          assert abs(r["alpha"] - ((107/102 - 1) - (505/502 - 1))) < 5e-5  # benchmark asof(entry)
          assert L.settle_return(stock, bench, "2026-10-20", holding=5, today="2026-10-27") is None  # window incomplete
          assert L.settle_return(stock, bench, "2026-10-20", holding=5, today="2026-10-28") is None  # live bar
          print("settlement discipline: PASS")
          EOF
      - name: verdict dual-exit discipline (pure, no network)
        run: |
          python3 - <<'EOF'
          import importlib.util
          spec = importlib.util.spec_from_file_location("ta", "scripts/tradingagents.py")
          M = importlib.util.module_from_spec(spec); spec.loader.exec_module(M)
          ok = lambda s: M.resolve_verdict(s)["decision"]
          assert ok('{"decision":"buy","confidence":80}') == "BUY"            # normalized
          assert ok('```json\n{"decision":"Overweight","confidence":61}\n```') == "OVERWEIGHT"
          assert ok('{"decision":"PASS","confidence":50}') == "PASS"           # first-class stays
          assert ok('{"decision":"MAYBE","confidence":50}') == "REVIEW"        # outside vocabulary
          assert ok('{"confidence":50}') == "REVIEW"                           # missing decision
          assert ok('not json at all') == "REVIEW"                             # unparseable
          v = M.resolve_verdict('{"decision":"BUY","confidence":80,"reasoning":"x"}')
          assert v["confidence"] == 80 and v["reasoning"] == "x"               # payload preserved
          print("verdict dual-exit: PASS")
          EOF
      - name: html render structure (pure, no network)
        run: |
          python3 - <<'EOF'
          import importlib.util, re
          spec = importlib.util.spec_from_file_location("rh", "scripts/render_html.py")
          R = importlib.util.module_from_spec(spec); spec.loader.exec_module(R)
          md = "\n".join([
              "# IC-MEMO · X · 2026-01-01", "",
              "```yaml", "ticker: X", "decision: PASS", "```", "",
              "## 1 · Analyst notes", "- [A1] fact one", "",
              "## 2 · Guest critiques",
              "| Guest | Stance | Conviction |", "|---|---|---|", "| Warren Buffett | PASS | 72 |", "",
              "---", "*footer · not investment advice*"])
          h = R.render(md)
          for needle in ("<nav>", 'pre class="yaml"', "<table>", "<h2 id="):
              assert needle in h, needle
          ids = set(re.findall(r'<h2 id="([^"]+)"', h))
          links = set(re.findall(r'href="#([^"]+)"', h))
          assert links <= ids and len(links) == 2, (links, ids)
          print("html render: PASS")
          EOF
      - name: portfolio three-state discipline (pure, no network)
        run: |
          python3 - <<'EOF'
          import importlib.util, json, tempfile
          spec = importlib.util.spec_from_file_location("ta", "scripts/tradingagents.py")
          M = importlib.util.module_from_spec(spec); spec.loader.exec_module(M)
          assert M.render_portfolio(None, "NVDA") == ""
          flat = M.render_portfolio({"cash": 100.0, "currency": "USD", "positions": []}, "NVDA")
          assert "No current position in NVDA" in flat and "Cash available: 100.00 USD" in flat
          held = M.render_portfolio({"cash": 25000.0, "currency": "USD", "positions": [
              {"ticker": "NVDA", "quantity": 120, "average_price": 150.0},
              {"ticker": "AAPL", "quantity": 10}]}, "NVDA")
          assert "Current position in NVDA: 120 units, average price 150.00" in held
          assert "Other positions: AAPL 10" in held
          bad = json.dumps({"positions": [{"ticker": "NVDA", "quantity": 1e999}]})
          f = tempfile.NamedTemporaryFile("w", suffix=".json", delete=False); f.write(bad); f.close()
          try:
              M.load_portfolio(f.name); assert False, "non-finite accepted"
          except SystemExit:
              pass
          print("portfolio three-state: PASS")
          EOF
      - name: as-of date parser discipline (pure, no network)
        run: |
          python3 - <<'EOF2'
          import importlib.util, datetime as dt
          spec = importlib.util.spec_from_file_location("fc", "scripts/fetch_card.py")
          M = importlib.util.module_from_spec(spec); spec.loader.exec_module(M)
          assert M.parse_as_of(None) is None
          assert M.parse_as_of("2026-11-01") == "2026-11-01"
          today = dt.date.today()
          for bad in ["2026-1-1", "not-a-date", (today + dt.timedelta(days=1)).isoformat()]:
              try:
                  M.parse_as_of(bad); assert False, bad
              except SystemExit:
                  pass
          print("as-of parser: PASS")
          EOF2
      - name: cost-guard usage parser (pure, no network)
        run: |
          python3 - <<'EOF3'
          import importlib.util
          spec = importlib.util.spec_from_file_location("ta", "scripts/tradingagents.py")
          M = importlib.util.module_from_spec(spec); spec.loader.exec_module(M)
          assert M.take_usage({}) == (0, 0)
          assert M.take_usage(None) == (0, 0)
          assert M.take_usage({"usage": {"prompt_tokens": 100, "completion_tokens": 50}}) == (100, 50)
          assert M.take_usage({"usage": {"prompt_tokens": "7", "completion_tokens": None}}) == (7, 0)
          print("take_usage: PASS")
          EOF3
      - name: portfolio allocation resolver (pure, no network)
        run: |
          python3 - <<'EOF4'
          import importlib.util, sys
          sys.path.insert(0, "scripts")
          spec = importlib.util.spec_from_file_location("pc", "scripts/portfolio_committee.py")
          PC = importlib.util.module_from_spec(spec); sys.modules["pc"] = PC; spec.loader.exec_module(PC)
          r = PC.resolve_allocation('{"decision":"deploy","confidence":70,"weights":{"MSFT":30,"NVDA":20,"AAPL":15,"Cash":35},"cash_pct":35}')
          assert r["decision"] == "DEPLOY" and "Cash" not in r["weights"] and r["cash_pct"] == 35 and "_weight_warning" not in r
          for bad in ['garbage', '{"decision":"MAYBE"}', '{}']:
              assert PC.resolve_allocation(bad)["decision"] == "REVIEW"
          r3 = PC.resolve_allocation('{"decision":"DEPLOY","confidence":60,"weights":{"A":30},"cash_pct":20}')
          assert "_weight_warning" in r3
          print("allocation resolver: PASS")
          EOF4
      - name: data cards schema
        run: |
          python3 - <<'EOF'
          import json, glob, sys
          ok = 0
          for p in glob.glob("cards/*.json") + glob.glob("data/demo/*.json"):
              c = json.load(open(p))
              for k in ("ticker", "as_of", "price", "fundamentals", "technicals"):
                  assert c.get(k), f"{p} missing {k}"
              assert len(c["fundamentals"]) >= 3, f"{p} fundamentals < 3"
              ok += 1
          print(f"{ok} cards validated")
          EOF
      - name: npm bundle packs clean
        run: cd npm && npm pack --dry-run && rm -f *.tgz
      # LLM 真开庭冒烟走 manual dispatch（6 调用/次，须配 DEEPSEEK_API_KEY secret）
      - name: committee smoke (needs secret, dispatch only)
        if: github.event_name == 'workflow_dispatch' && env.DEEPSEEK_API_KEY != ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          grep -q '^export DEEPSEEK_API_KEY=' ~/.bashrc || echo "export DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY" >> ~/.bashrc
          timeout 300 python3 scripts/tradingagents.py --ticker DEMO | grep -q "IC-MEMO"
